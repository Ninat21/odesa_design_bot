name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: odesa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odesa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BOT_TOKEN: 1234567890:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/odesa_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/odesa_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Check schema drift
        run: python -m alembic check

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q app alembic tests main.py
