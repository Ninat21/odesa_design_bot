[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["ChatExport_*", "*.bak"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "I001"]
"app/texts/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
